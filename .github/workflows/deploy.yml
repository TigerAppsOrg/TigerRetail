name: CI and deploy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tigerretail-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.5'
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: bash deploy/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            release.tar.gz
            release.tar.gz.sha256
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Upload and activate release
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          sha256sum -c release.tar.gz.sha256
          checksum="$(cut -d ' ' -f1 release.tar.gz.sha256)"
          aws s3 cp release.tar.gz "s3://tigerretail-deploy-104733724423-us-east-1/releases/$RELEASE_ID.tar.gz" --only-show-errors
          command_id="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name TigerRetailDeploy \
            --parameters "Release=$RELEASE_ID,Sha256=$checksum" \
            --timeout-seconds 600 --query Command.CommandId --output text)"
          for attempt in $(seq 1 120); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) break ;;
              Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'
          [[ "$status" == Success ]]
          curl --retry 3 --retry-delay 5 --fail --silent --show-error https://retail.tigerapps.org/api/health
