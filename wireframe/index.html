<title>TigerRetail Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Playfair+Display:ital,wght@1,600;1,700&family=Poppins:wght@300;400;500;600&display=swap">
<style>
:root{
  --paper:#FFFCF3;
  --surface:#FFFFFF;
  --surface-2:#F6F3EA;
  --ink:#17150F;
  --ink-2:#4A453A;
  --muted:#6B6555;
  --faint:#756F5F;
  --line:#E4DFD1;
  --line-2:#EFEBE0;
  --ph:#E8E5DC;
  --ph-2:#DFDBD0;
  --tiger:#BB4C19;
  --tiger-bright:#DF5A1E;
  --tiger-ink:#FFFFFF;
  --tiger-soft:#FDF0E8;
  --hold:#986D22;
  --good:#3F7D52;
  --danger:#C0392B;
  --shadow:0 1px 2px rgba(23,21,15,.05);
  --shadow-lift:0 12px 40px rgba(23,21,15,.16);
  --r-card:14px;
  --r-pill:999px;
}
/* light is the default in every case; dark is opt-in through the toggle only */
:root[data-theme="dark"]{
  --paper:#16140F;
  --surface:#1E1B15;
  --surface-2:#252118;
  --ink:#F7F3E8;
  --ink-2:#D5CFBF;
  --muted:#9A9384;
  --faint:#948D7E;
  --line:#332E24;
  --line-2:#2A251C;
  --ph:#2C2820;
  --ph-2:#38332A;
  --tiger:#F2703A;
  --tiger-bright:#F2703A;
  --hold:#C89030;
  --tiger-ink:#1A1109;
  --tiger-soft:#3A2418;
  --danger:#E8705F;
  --shadow:0 1px 2px rgba(0,0,0,.4);
  --shadow-lift:0 12px 40px rgba(0,0,0,.55);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-weight:400;
  font-size:15px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-weight:600;text-wrap:balance}
:focus-visible{outline:2px solid var(--tiger);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.wordmark{
  font-family:'Playfair Display',Georgia,serif;
  font-style:italic;font-weight:700;
  color:var(--tiger);
  letter-spacing:-.01em;
  line-height:1;
  cursor:pointer;
  background:none;border:none;padding:0;
}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding-inline:24px}
@media(max-width:560px){.wrap{padding-inline:16px}}

/* ---------- top nav ---------- */
.nav{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:var(--paper);
  border-bottom:1px solid transparent;
}
.nav.scrolled{border-bottom-color:var(--line-2)}
.nav-in{
  max-width:1180px;margin:0 auto;padding:18px 24px;
  display:flex;align-items:center;gap:14px;
}
@media(max-width:560px){.nav-in{padding:14px 16px;gap:10px}}
.nav .wordmark{font-size:30px;margin-right:18px}

/* row 1: identity, search, actions.  row 2: one category row. */
.navsearch{
  flex:1;min-width:0;max-width:420px;display:flex;align-items:center;gap:9px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-pill);
  padding:0 16px;height:40px;color:var(--muted);transition:border-color .15s,background .15s;
}
.navsearch:focus-within{border-color:var(--tiger);background:var(--surface)}
.navsearch svg{flex:none}
.navsearch input{
  flex:1;min-width:0;border:0;background:none;outline:none;font-size:14.5px;color:var(--ink);height:100%;
}
.navsearch input::-webkit-search-cancel-button{cursor:pointer}
.icon-lbl{
  display:inline-flex;align-items:center;gap:7px;position:relative;
  font-size:14.5px;color:var(--ink-2);padding:8px 10px;border-radius:var(--r-pill);
}
.icon-lbl:hover{color:var(--tiger);background:var(--surface-2)}
.icon-lbl.active{color:var(--tiger);font-weight:500}
.icon-plain{display:grid;place-items:center;width:34px;height:34px;border-radius:8px;color:var(--muted)}
.icon-plain:hover{color:var(--tiger);background:var(--surface-2)}
.badge{
  background:var(--tiger);color:var(--tiger-ink);font-style:normal;
  font-size:10.5px;font-weight:600;border-radius:var(--r-pill);
  padding:1px 6px;line-height:15px;min-width:17px;text-align:center;
}
.badge.sm{font-size:10px;padding:0 5px;margin-left:5px}
.catbar{border-top:1px solid var(--line-2)}
.catbar-in{
  max-width:1180px;margin:0 auto;padding:10px 24px;
  display:flex;align-items:center;gap:26px;flex-wrap:wrap;
}
@media(max-width:560px){.catbar-in{padding:9px 16px;gap:14px}}
.catwrap{position:relative;display:flex;align-items:center;gap:6px}
.cat-dept{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-pill);
  padding:2px 8px 2px 10px;font-size:11.5px;color:var(--muted);letter-spacing:.01em;
}
.cat-dept:hover{border-color:var(--tiger);color:var(--tiger)}
.cat-dept svg{width:12px;height:12px}
.catwrap.open .cat-dept{border-color:var(--tiger);color:var(--tiger)}
.catwrap.open .cat-dept svg{transform:rotate(180deg)}
.dept-panel{
  position:absolute;left:0;top:calc(100% + 8px);z-index:96;min-width:170px;
  background:var(--surface);border:1px solid var(--line);border-radius:12px;
  box-shadow:var(--shadow-lift);padding:6px;
}
.dept-panel button{
  display:block;width:100%;text-align:left;padding:9px 12px;border-radius:8px;
  font-size:14px;color:var(--ink-2);
}
.dept-panel button:hover{background:var(--surface-2);color:var(--tiger)}
.dept-panel button.on{color:var(--tiger);font-weight:600}

/* my offers */
.offerlist{display:flex;flex-direction:column;gap:12px}
.offercard{
  display:grid;grid-template-columns:76px 1fr auto;gap:16px;align-items:center;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:12px;cursor:pointer;transition:border-color .15s;
}
.offercard:hover{border-color:var(--ink-2)}
@media(max-width:560px){.offercard{grid-template-columns:60px 1fr;gap:12px}}
.offershot{border-radius:9px;overflow:hidden;aspect-ratio:4/5;position:relative;background:var(--ph)}
.offershot svg{position:absolute;inset:0;width:100%;height:100%}
.offerbody{display:flex;flex-direction:column;gap:3px;min-width:0}
.offermine{font-size:13px;color:var(--ink-2)}
.ostat{
  font-size:12px;font-weight:500;border-radius:var(--r-pill);padding:5px 12px;white-space:nowrap;
  border:1px solid var(--line);color:var(--muted);
}
@media(max-width:560px){.ostat{grid-column:1/-1;justify-self:start}}
.ostat.leading{background:var(--tiger-soft);border-color:var(--tiger);color:var(--tiger)}
.ostat.accepted{background:var(--tiger-soft);border-color:var(--hold);color:var(--hold)}
.ostat.sold{background:var(--surface-2)}
@media(max-width:900px){
  /* categories drop onto their own full-width row instead of being squeezed */
  .nav-in{flex-wrap:wrap;row-gap:10px;gap:8px}
  .nav-links{order:3;flex:1 0 100%;width:100%;gap:14px 16px;flex-wrap:wrap;overflow:visible}
  .cat-btn{font-size:14.5px}
  .nav .wordmark{font-size:24px;margin-right:0}
  .nav-right{margin-left:auto;gap:10px}
  .pill-sell{padding:7px 16px}
  }
.cat-btn{
  font-size:16px;color:var(--ink);padding:6px 0;white-space:nowrap;flex:none;
  border-bottom:2px solid transparent;transition:color .15s;
}
.cat-btn:hover{color:var(--tiger)}
.cat-btn.active{color:var(--tiger)}
.nav-right{display:flex;align-items:center;gap:10px;flex:none}
/* selling is the action the whole app exists for, so it gets the primary pill */
.pill-sell{
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  background:var(--tiger);color:var(--tiger-ink);border-radius:var(--r-pill);
  padding:9px 20px;font-size:15px;font-weight:500;transition:filter .15s;
}
.pill-sell:hover{filter:brightness(1.08)}
.pill-sell.active{filter:brightness(.92)}
.pill-sell svg{width:15px;height:15px}
.link-you{font-size:15.5px;padding:8px 4px}
.link-you.active{color:var(--tiger)}
.icons{display:flex;align-items:center;gap:12px;margin-left:6px}
.icons button{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--ink-2)}
.icons button:hover{color:var(--tiger);background:var(--surface-2)}
.icons .n{
  position:absolute;transform:translate(9px,-9px);
  background:var(--tiger);color:var(--tiger-ink);
  font-size:10px;font-weight:600;border-radius:var(--r-pill);
  padding:0 5px;line-height:15px;min-width:15px;text-align:center;
}
svg{display:block}

/* ---------- generic bits ---------- */
.btn{
  border-radius:var(--r-pill);padding:11px 26px;font-size:15px;font-weight:500;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  transition:transform .12s,background .15s,border-color .15s;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--tiger);color:var(--tiger-ink)}
.btn-primary:hover{filter:brightness(1.06)}
/* every disabled button reads as disabled — not just the primary */
.btn[disabled]{background:var(--ph);color:var(--muted);border-color:transparent;cursor:not-allowed;filter:none}
.btn[disabled]:hover{filter:none;border-color:transparent}
.btn[disabled]:active{transform:none}
.btn-outline{border:1px solid var(--line);background:var(--surface)}
.btn-outline:hover{border-color:var(--ink-2)}
.btn-soft{background:var(--surface-2)}
.btn-soft:hover{background:var(--ph)}
.btn-ghost{color:var(--muted);padding:11px 8px}
.btn-ghost:hover{color:var(--ink)}
.btn-block{width:100%}
.danger{color:var(--danger)}

.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--tiger);color:var(--tiger-ink);
  border-radius:var(--r-pill);padding:4px 12px;
  font-size:12.5px;font-weight:500;
}
.chip-hold{background:var(--hold)}
.chip-sold{background:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--tiger);flex:none}

.muted{color:var(--muted)}
.sub{color:var(--muted);font-size:14px;line-height:1.55;max-width:62ch}
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sec-title{font-size:26px;font-weight:600;letter-spacing:-.01em}
.link-act{color:var(--tiger);font-size:15px;font-weight:500}
.link-act:hover{text-decoration:underline}
.rule{height:1px;background:var(--line-2);border:0;margin:0}

/* ---------- product cards ---------- */
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
@media(max-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:10px;display:flex;flex-direction:column;gap:10px;position:relative;
  text-align:left;width:100%;transition:border-color .15s,transform .12s;cursor:pointer;
}
.card:hover{border-color:var(--ink-2)}
.card[data-taken="1"]{opacity:.4;cursor:not-allowed}
.card.sel{border-color:var(--tiger);box-shadow:0 0 0 2px var(--tiger-soft)}
.ph{
  position:relative;border-radius:10px;background:var(--ph);
  aspect-ratio:4/5;max-width:100%;overflow:hidden;display:grid;place-items:center;
}
.ph>svg.glyph{opacity:.5;color:var(--faint)}
.ph>svg.art{position:absolute;inset:0;width:100%;height:100%}
:root[data-theme="dark"] .ph>svg.art{opacity:.88}
.ph-badge{position:absolute;right:8px;bottom:8px}
.ph-fav{
  position:absolute;right:8px;top:8px;
  background:var(--surface);border-radius:var(--r-pill);
  padding:3px 9px;display:flex;align-items:center;gap:5px;
  font-size:12px;box-shadow:var(--shadow);color:var(--ink-2);
}
.ph-tools{position:absolute;right:8px;top:8px;display:flex;gap:4px}
.ph-tools button{
  width:26px;height:26px;display:grid;place-items:center;border-radius:7px;
  background:var(--surface);box-shadow:var(--shadow);color:var(--ink-2);
}
.ph-tools button:hover{color:var(--tiger)}
.card-text{display:flex;flex-direction:column;gap:2px;margin-top:-2px}
.card-name{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.card-name b{font-weight:600;font-size:14.5px;line-height:1.3}
.card-name span{font-weight:600;font-size:14.5px;font-variant-numeric:tabular-nums;flex:none}
.card-meta{font-size:12.5px;color:var(--muted);line-height:1.35}

/* ---------- home ---------- */
.hero{position:relative;padding:34px 0 14px;display:grid;place-items:center}
.hero-stack{position:relative;width:min(760px,100%)}
.hero-block{
  position:absolute;right:0;top:4%;width:56%;height:74%;
  background:var(--tiger-bright);border-radius:2px;
}
.hero-type{
  position:relative;font-family:'Bowlby One',Impact,sans-serif;
  font-size:clamp(46px,10.5vw,116px);line-height:.86;letter-spacing:-.02em;
  text-align:center;color:var(--ink);mix-blend-mode:multiply;
}
:root[data-theme="dark"] .hero-type{mix-blend-mode:normal}
.hero-tag{
  position:relative;text-align:center;font-weight:600;font-size:clamp(14px,2.4vw,22px);
  margin-top:6px;color:var(--ink);
}
.circled{position:relative;display:inline-block}
.circled svg{position:absolute;left:-14px;top:-8px;width:calc(100% + 28px);height:calc(100% + 18px);color:var(--tiger-bright);pointer-events:none}

/* ---------- breadcrumb / filter bar ---------- */
.crumbbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:6px 0 18px}
.crumb{font-size:13px;color:var(--muted)}
.crumb b{font-weight:500;color:var(--ink-2)}
.tools{display:flex;align-items:center;gap:8px}
.tool{
  display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);
  padding:6px 12px;border-radius:var(--r-pill);border:1px solid transparent;
}
.tool:hover{border-color:var(--line);color:var(--ink)}
.tool.on{border-color:var(--tiger);color:var(--tiger)}
.field{display:flex;flex-direction:column;gap:6px;min-width:150px}
.field label{font-size:12px;text-transform:lowercase;letter-spacing:.02em;color:var(--muted)}
select,.inp{
  background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:14px;width:100%;
}
select:focus,.inp:focus{border-color:var(--tiger);outline:none}
textarea.inp{min-height:110px;resize:vertical}

/* ---------- item detail ---------- */
.detail{
  display:grid;grid-template-columns:1.55fr 1fr;gap:22px;align-items:start;
}
@media(max-width:820px){.detail{grid-template-columns:1fr}}
.detail-main{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:26px;
}
@media(max-width:640px){.detail-main{grid-template-columns:1fr;gap:18px}}
.detail-info{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.detail-info h1{font-size:23px;font-weight:600}
.price{font-size:20px;font-weight:600;color:var(--tiger);font-variant-numeric:tabular-nums}
.attr{font-size:13px;color:var(--muted);line-height:1.7}
.tryrow{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--ink-2)}
.desc{font-size:14.5px;font-weight:500;line-height:1.6}
.rail h3{font-size:16px;font-weight:600;margin-bottom:12px}
.rail .grid{grid-template-columns:1fr}

/* ---------- sell flow ---------- */
.sellbar{max-width:1180px;margin:0 auto;padding:22px 24px 6px}
@media(max-width:560px){.sellbar{padding:16px 16px 4px}}
.sellbar .wordmark{font-size:28px}
.sell-top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:10px}
.sell-title{font-size:17px;font-weight:500}
.steps{display:flex;align-items:center;gap:10px;margin:22px 0 4px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--faint)}
.step i{
  width:19px;height:19px;border-radius:50%;background:var(--ph);color:var(--muted);
  display:grid;place-items:center;font-size:11px;font-style:normal;font-weight:600;
}
.step.on{color:var(--ink)}
.step.on i{background:var(--tiger);color:var(--tiger-ink)}
.step.done i{background:var(--good);color:#fff}
.step-sep{width:18px;height:1px;background:var(--line)}
.q{font-size:25px;font-weight:600;letter-spacing:-.01em;margin:26px 0 6px;text-align:center}
.q-sub{text-align:center;margin:0 auto 26px;color:var(--muted);font-size:14px;max-width:56ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px}
@media(max-width:760px){.two{grid-template-columns:1fr;gap:26px}}
.blk h3{font-size:19px;font-weight:600;margin-bottom:12px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:7px 0;cursor:pointer}
.opt input{margin:4px 0 0;accent-color:var(--tiger);width:15px;height:15px;flex:none}
.opt-l{display:flex;flex-direction:column;gap:1px;font-size:14px}
.opt-l .strong{font-weight:600}
.opt-r{margin-left:auto;font-size:12.5px;color:var(--muted);align-self:center}
.opt-r:hover{color:var(--tiger);text-decoration:underline}
.saved{text-align:right;font-size:12px;color:var(--faint);margin-top:6px}
.footbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  margin:38px 0 60px;flex-wrap:wrap;
}
/* ---- the item card: the busiest form in the app, so it gets real colour ---- */
.itemcard{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  display:grid;grid-template-columns:260px 1fr;gap:24px;margin-bottom:18px;
  padding:0 20px 20px;overflow:hidden;
}
@media(max-width:700px){.itemcard{grid-template-columns:1fr}}
.itemhead{
  grid-column:1/-1;margin:0 -20px 4px;padding:11px 20px;
  background:var(--tiger-soft);border-bottom:1px solid var(--line-2);
  display:flex;align-items:center;gap:10px;font-size:13px;color:var(--tiger);font-weight:500;
}
.itemhead .n{
  width:20px;height:20px;border-radius:50%;background:var(--tiger);color:var(--tiger-ink);
  display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;
}
.itemhead .rm{margin-left:auto;font-size:12.5px;color:var(--muted)}
.itemhead .rm:hover{color:var(--danger)}
.itemcard .gal{display:flex;flex-direction:column;gap:9px;padding-top:16px}
.galgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.shot{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:4/5;background:var(--ph)}
.shot.cover{outline:2px solid var(--tiger);outline-offset:1px}
.covertag{
  position:absolute;left:5px;bottom:5px;background:var(--tiger);color:var(--tiger-ink);
  font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:var(--r-pill);letter-spacing:.03em;
}
.shot-tools{position:absolute;right:4px;top:4px;display:flex;gap:3px}
.shot-tools button{
  width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
  background:var(--surface);color:var(--ink-2);box-shadow:var(--shadow);
}
.shot-tools button:hover{color:var(--tiger)}
.addshot{
  aspect-ratio:4/5;border:1.5px dashed var(--tiger);border-radius:10px;
  background:var(--tiger-soft);color:var(--tiger);
  display:grid;place-items:center;gap:2px;font-size:10.5px;font-weight:500;text-align:center;
  transition:filter .15s;
}
.addshot:hover{filter:brightness(.96)}
.addshot svg{width:17px;height:17px}
.galnote{font-size:11.5px;color:var(--muted);margin:0}

.itembody{padding-top:16px}
.titleline{
  font-size:19px;font-weight:600;border:1px solid var(--line);border-radius:10px;
  background:var(--surface-2);padding:9px 12px;width:100%;
}
.titleline:focus{border-color:var(--tiger);background:var(--surface);outline:none}
.priceline{display:flex;align-items:center;gap:6px;margin:10px 0 16px}
.priceline span{color:var(--tiger);font-size:19px;font-weight:600}
.priceline input{
  border:1px solid var(--line);border-radius:10px;background:var(--surface-2);width:110px;

const normBrand = (s)=> String(s||"").toLowerCase().replace(/&/g," and ")
  .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
/* every spelling a brand answers to */
const brandKeys = (b)=> [b.name, ...b.aliases].map(normBrand);
/* suggestions, best first */
function brandMatches(q,limit){
  const n=normBrand(q);
  if(!n) return S.brands.slice(0,limit||8);
  const scored=[];
  S.brands.forEach(b=>{
    let best=Infinity;
    brandKeys(b).forEach(k=>{
      let s;
      if(k===n) s=0;
      else if(k.startsWith(n)) s=1;
      else if(k.includes(n)||n.includes(k)) s=2;
      else{ const d=lev(k,n); s = d<=Math.max(1,Math.floor(k.length/4)) ? 3+d : Infinity; }
      if(s<best) best=s;
    });
    if(best<Infinity) scored.push([best,b]);
  });
  scored.sort((x,y)=> x[0]-y[0] || x[1].name.localeCompare(y[1].name));
  return scored.slice(0,limit||8).map(x=>x[1]);
}
/* the canonical name this text should collapse onto, or null if genuinely new */
function canonBrand(q){
  const n=normBrand(q);
  if(!n) return null;
  for(const b of S.brands) if(brandKeys(b).includes(n)) return b.name;
  const near=S.brands.find(b=>brandKeys(b).some(k=>{
    if(k.startsWith(n)&&n.length>=3) return true;
    return lev(k,n)<=Math.max(1,Math.floor(k.length/5));
  }));
  return near?near.name:null;
}
/* a brand nobody has used yet joins the catalog for everyone */
function learnBrand(raw){
  const name=String(raw||"").trim().toLowerCase();
  if(!name) return "unbranded";
  const hit=canonBrand(name);
  if(hit) return hit;
  S.brands.push({name:name,aliases:[],added:true});
  S.brands.sort((a,b)=>a.name.localeCompare(b.name));
  return name;
}

    case "shoe":  return `${z.shoe} ${z.scale==="men's"?"(m)":z.scale==="unisex"?"(u)":"(w)"}`;

    if(l.cat==="clothing") l.sub = SUB_ALIAS[l.sub] || l.sub;
    l.brand = canonBrand(l.brand) || l.brand;
    if(!l.sizing){
      /* older seeds carry a plain string; infer the system it belonged to */
      const s = SIZE_ALIAS[l.size] || l.size || "n/a";
      const sys = defaultSystem(l.cat,l.sub,l.title);
      const z = blankSizing(sys);
      if(sys==="shoe"){ z.shoe = String(parseFloat(s)||8); z.scale = /\(m\)|men/.test(s)?"men's":"women's"; }
      else if(sys==="one"){ /* nothing to set */ }
      else if(sys==="na"){ /* nothing to set */ }
      else { z.system="alpha"; z.alpha = SIZES.includes(s) ? s : "medium"; }

  });
  return S;
}

const find = (id)=> S.listings.find(l=>l.id===id);
/* every listing I have bid on, newest bid first, with what happened to it */
function myOffers(){
  const me=S.user.netid, out=[];
  S.listings.forEach(l=>{
    const mine=l.offers.filter(o=>o.netid===me);
    if(!mine.length) return;
    const best=mine.reduce((a,b)=>b.amt>a.amt?b:a);
    const top=Math.max(...l.offers.map(o=>o.amt));
    out.push({listing:l, offer:best,
      status: l.status==="sold" ? "sold"
            : l.status==="hold" ? "accepted"
            : best.amt>=top ? "leading" : "outbid"});
  });
  return out;
}

function toast(msg){

}

function stamp(){
  const d=new Date();
  const p=n=>String(n).padStart(2,"0");
  let h=d.getHours(); const ap=h>=12?"PM":"AM"; h=h%12||12;
  return `${p(d.getMonth()+1)}/${p(d.getDate())}/${String(d.getFullYear()).slice(2)} at ${h}:${p(d.getMinutes())} ${ap}`;
}
function ageLabel(d){
  if(d===0) return "today";

}

function payLabel(p){ return p.handle.trim() ? `${p.label} ${p.handle.trim()}` : p.label; }

/* scope "account" edits the saved defaults; "listing" picks which of them this listing takes */
/* Every method is always listed and always editable, in both places. Ticking a
   new one while listing also switches it on for the account, so the sell flow
   is never a dead end that sends you off to settings. */
function payEditor(scope){
  const listing = scope==="listing";
  const rows = S.user.pay.map(p=>{
    const on = listing ? S.sell.contact.pay.includes(p.id) : p.on;
    const needsHandle = on && p.needsHandle && !p.handle.trim();
    return `<label class="payrow ${on?"on":""} ${needsHandle?"warn":""}">
      <input type="checkbox" ${on?"checked":""} data-paytoggle="${scope}|${p.id}">
      <span class="pl">${esc(p.label)}</span>
      <input class="ph-in" type="text" value="${esc(p.handle)}"
        placeholder="${esc(needsHandle?"add your "+(p.hint||"details"):(p.hint||""))}"
        data-payhandle="${esc(p.id)}" aria-label="${esc(p.label)} details">
    </label>`;
  }).join("");
  const missing = S.user.pay.filter(p=>(listing?S.sell.contact.pay.includes(p.id):p.on) && p.needsHandle && !p.handle.trim());
  return `<div class="paygrid">${rows}</div>
    ${missing.length?`<p class="paywarn">add ${esc(missing.map(p=>p.label).join(" and "))} details so buyers know where to send it.</p>`:""}`;
}

/* Filters are lists. Coerce defensively so one stray scalar can never throw
   inside render() and take the whole page down with it. */
const FACETS=["size","brand","color","price","condition","occasion"];
function normFilters(f){
  FACETS.forEach(k=>{
    if(!Array.isArray(f[k])) f[k] = (f[k]==null||f[k]==="all") ? [] : [f[k]];
  });
  return f;
}
function applyFilters(list,f){
  normFilters(f);
  let r=list;
  if(f.fitsMe && deptRelevant()) r=r.filter(fitsProfile);
  else if(f.size.length) r=r.filter(l=>f.size.includes(sizeFacet(l)));
  if(f.brand.length)     r=r.filter(l=>f.brand.includes(l.brand));
  if(f.color.length)     r=r.filter(l=>f.color.includes(l.pal));
  if(f.price.length)     r=r.filter(l=>f.price.some(b=>inBand(l.price,b)));
  if(f.condition.length) r=r.filter(l=>f.condition.includes(l.condition));
  if(f.occasion.length)  r=r.filter(l=>f.occasion.includes(l.occasion));
  return r;
}

/* ---- multi-select dropdown, used by the filter rail and the size profile ---- */
function msGet(scope,key){ return (scope==="prefs" ? S.user.prefs[key] : S[scope][key]) || []; }
function msSet(scope,key,arr){ if(scope==="prefs") S.user.prefs[key]=arr; else S[scope][key]=arr; }
function multiSel(scope,key,label,values,fmt,allWord){
  const sel=msGet(scope,key), id=scope+"|"+key, open=S.openMs===id;
  const show=v=>esc(fmt?fmt(v):v);
  const summary = !sel.length ? (allWord||"all")
    : sel.length===1 ? show(sel[0])
    : sel.length+" picked";
  return `<div class="ms ${open?"open":""}">
    <button class="ms-btn ${sel.length?"on":""}" data-mstoggle="${id}" aria-expanded="${open}">
      <span class="ms-label">${esc(label)}</span>
      <span class="ms-val">${summary}</span>${I.down}
    </button>
    ${open?`<div class="ms-panel">
      ${values.length>10?`<input class="ms-search" data-mssearch="${id}" placeholder="search ${esc(label)}" autocomplete="off">`:""}
      <button class="ms-clear" data-msall="${id}">${sel.length?"clear all "+label:"show all"}</button>
      ${values.map(v=>`<label class="ms-opt ${sel.includes(v)?"on":""}" data-msrow="${esc(String(fmt?fmt(v):v)).toLowerCase()}">
        <input type="checkbox" ${sel.includes(v)?"checked":""} data-mspick="${id}|${esc(v)}">
        <span>${show(v)}</span>
      </label>`).join("")}
      ${values.length?"":`<div class="ms-opt muted" style="cursor:default">nothing here yet</div>`}
    </div>`:""}
  </div>`;
}
function sortList(list,sort){
  const r=[...list];
  if(sort==="price-asc")  return r.sort((a,b)=>a.price-b.price);
  if(sort==="price-desc") return r.sort((a,b)=>b.price-a.price);
  if(sort==="loved")      return r.sort((a,b)=>(b.favs+(S.favs.has(b.id)?1:0))-(a.favs+(S.favs.has(a.id)?1:0)));
  return r.sort((a,b)=>a.ageDays-b.ageDays);
}
const activeCount = (f)=> FACETS.reduce((n,k)=>n+normFilters(f)[k].length,0) + ((f.fitsMe&&deptRelevant())?1:0);

/* one filter rail, driven by whichever state object the screen owns */
function filterRail(scope,base){
  const f=normFilters(S[scope]);
  const uniq=(fn)=>[...new Set(base.map(fn))].filter(Boolean);
  const bandLabel=v=>(PRICE_BANDS.find(b=>b[0]===v)||[,v])[1];
  /* only offer a facet when there is a real choice to make (or one is already set) */
  const useful=(vals,key)=>vals.length>1 || (f[key]&&f[key].length);

  const pills=[];
  if(f.fitsMe && deptRelevant()) pills.push(`<button class="pill" data-clearf="${scope}|fitsMe">fits me ${I.x}</button>`);
  [["size","size",null],["brand",null,null],["color",null,v=>COLOR_LABEL[v]||v],
   ["price",null,bandLabel],["condition",null,null],["occasion",null,null]].forEach(([k,prefix,fmt])=>{
    f[k].forEach(v=>pills.push(
      `<button class="pill" data-pop="${scope}|${k}|${esc(v)}">${prefix?esc(prefix)+" ":""}${esc(fmt?fmt(v):v)} ${I.x}</button>`));
  });

  return `<div class="rail-controls">
      <div class="fgroup">
        ${S.user.prefs.set&&deptRelevant()?`<button class="chipbtn ${f.fitsMe?"on":""}" data-fitsme="${scope}" title="${esc(profileSummary())}">fits me</button>`:""}
        ${useful(uniq(sizeFacet).filter(v=>v!=="n/a").sort(bySize),"size")?multiSel(scope,"size","size",uniq(sizeFacet).filter(v=>v!=="n/a").sort(bySize)):""}
        ${useful(uniq(l=>l.brand),"brand")?multiSel(scope,"brand","brand",uniq(l=>l.brand).sort()):""}
        ${useful(uniq(l=>l.pal),"color")?multiSel(scope,"color","colour",uniq(l=>l.pal).sort(),v=>COLOR_LABEL[v]||v):""}
        ${multiSel(scope,"price","price",PRICE_BANDS.map(b=>b[0]),bandLabel,"any price")}
        ${useful(CONDITIONS.filter(c=>uniq(l=>l.condition).includes(c)),"condition")?multiSel(scope,"condition","condition",CONDITIONS.filter(c=>uniq(l=>l.condition).includes(c))):""}
        ${useful(uniq(l=>l.occasion).filter(o=>o!=="none"),"occasion")?multiSel(scope,"occasion","occasion",uniq(l=>l.occasion).filter(o=>o!=="none").sort()):""}
      </div>
      <label class="fsel sortsel" for="${scope}-sort">sort by
        <select id="${scope}-sort" data-f="${scope}|sort">
          ${SORTS.map(([v,t])=>`<option value="${v}" ${f.sort===v?"selected":""}>${esc(t)}</option>`).join("")}
        </select></label>
    </div>
    ${pills.length?`<div class="pills">${pills.join("")}
      <button class="pill clear" data-clearall="${scope}">clear all</button></div>`:""}`;
}

function deptRelevant(){

/* does this listing match the sizing profile, on its own system's terms? */
function fitsProfile(l){
  const p=S.user.prefs, z=l.sizing;
  if(!z) return true;
  switch(z.system){
    case "alpha": return anyOf(p.alpha,z.alpha) || anyOf(p.numeric,z.alpha);
    case "waist": return anyOf(p.waist,z.waist) && anyOf(p.length,z.length) && anyOf(p.fit,z.fit);
    case "shoe":  return anyOf(p.shoe,z.shoe) && z.scale===p.shoeScale;
    case "one":   return true;   /* one-size always fits */
    default:      return true;   /* dorm goods have no size to miss */
  }
}

function sizeFields(it,idx){
  const z=it.sizing;
  if(z.system==="na") return `<div class="frow"><label>size</label><span class="muted" style="font-size:13px">not applicable</span></div>`;
  if(z.system==="one") return `<div class="frow"><label>size</label><span class="muted" style="font-size:13px">one size</span></div>`;
  if(z.system==="shoe") return `<div class="frow"><label>shoe size</label>
      <select data-sz="${idx}|shoe" style="max-width:86px">${opts(SHOE_SIZES,z.shoe)}</select>
      <select data-sz="${idx}|scale" style="max-width:110px">${opts(SHOE_SCALES,z.scale)}</select>
    </div>`;
  if(z.system==="waist") return `<div class="frow"><label>waist × length</label>
      <select data-sz="${idx}|waist" style="max-width:74px">${opts(WAISTS,z.waist)}</select>
      <span class="muted">×</span>
      <select data-sz="${idx}|length" style="max-width:74px">${opts(LENGTHS,z.length)}</select>
      ${it.sub==="bottoms"?`<button class="btn btn-ghost" data-sysswap="${idx}|alpha" style="font-size:12px;padding:2px 6px">use s/m/l instead</button>`:""}
    </div>
    <div class="frow"><label>fit</label>
      <select data-sz="${idx}|fit">${opts(FITS,z.fit)}</select>
    </div>`;
  return `<div class="frow"><label>size</label>
      <select data-sz="${idx}|alpha">${opts([...ALPHA_SIZES,...NUM_SIZES],z.alpha)}</select>
      ${it.sub==="bottoms"?`<button class="btn btn-ghost" data-sysswap="${idx}|waist" style="font-size:12px;padding:2px 6px">use waist × length</button>`:""}

}

  if(m.type==="offer"){

          </div>
        </div>
      </div>
    </div></div>`;
  }
  if(m.type==="offers"){
    const l=find(m.id); if(!l) return "";
    const offers=[...l.offers].sort((a,b)=>b.amt-a.amt);
    const kind=l.cat==="dorm"?"dorm":"clothing";
    return `<div class="veil" data-veil="1"><div class="modal">
      <button class="x" data-close="1" aria-label="close">${I.x}</button>
      <div class="offer-two">
        <div class="minicard">
          ${phBox("",l,`<div class="ph-tools"><button data-edit="${l.id}">${I.pencil}</button><button data-menu="${l.id}">${I.dots}</button></div>`)}
          <div class="card-text" style="margin-top:8px">
            <div class="card-name"><b>${esc(l.title)}</b><span>${money(l.price)}</span></div>
            <div class="card-meta">${l.size&&l.size!=="n/a"?esc(l.size)+" &middot; ":""}${esc(l.brand)}</div>
          </div>
        </div>
        <div>
          <h3 style="font-size:20px;margin-bottom:12px">current offers</h3>
          ${offers.length?offers.map((o,i)=>`<button class="offrow ${S.selectedOffer===i?"sel":""}" data-pickoffer="${i}">
            <b>${money(o.amt)}</b><small>${esc(o.netid)} &middot; ${esc(o.when)}</small>
            ${o.tryOn?`<span class="dot" title="try-on requested"></span>`:""}
          </button>`).join(""):`<div class="empty" style="padding:22px">no offers yet.</div>`}
          ${offers.some(o=>o.tryOn)?`<div class="legend"><span class="dot"></span> try-on requested</div>`:""}
          ${offers.length?`<div style="display:flex;justify-content:flex-end;margin-top:16px">
            <button class="btn btn-primary" data-acceptoffer="${l.id}" ${S.selectedOffer===null?"disabled":""}>accept this offer</button>
          </div>`:""}
        </div>
      </div>
    </div></div>`;
  }
  if(m.type==="touch"){
    const l=find(m.id); if(!l) return "";
    const o=m.offer;
    const kind=l.cat==="dorm"?"dorm":"clothing";
    const methods = (l.pay&&l.pay.length ? l.pay : payOn().map(p=>p.id))
      .map(id=>S.user.pay.find(p=>p.id===id)).filter(Boolean).map(payLabel);
    const pay = methods.length ? methods.join(" or ") : "(no payment method set)";
    const draft = `hi ${o.netid}! your ${money(o.amt)} offer on "${l.title}" is accepted.\n\npickup: ${l.pickup||S.user.pickup||"(add pickup details in contact + pickup)"}\npayment: ${pay}\n\n— ${S.user.netid}`;
    return `<div class="veil" data-veil="1"><div class="modal">
      <button class="x" data-close="1" aria-label="close">${I.x}</button>
      <div class="offer-two">
        <div class="minicard">
          ${phBox("",l,"")}
          <div class="card-text" style="margin-top:8px">
            <div class="card-name"><b>${esc(l.title)}</b><span>${money(l.price)}</span></div>

          </div>
        </div>
        <div>
          <h3 style="font-size:20px">get in touch</h3>
          <p class="sub" style="margin:6px 0 16px">ready to schedule a pickup/try-on time with <b>${esc(o.netid)}</b>?</p>
          <button class="btn btn-outline btn-block" data-contact="email" style="margin-bottom:10px">${I.mail} email them</button>
          <button class="btn btn-outline btn-block" data-contact="text">${I.chat} send them a text</button>
          <div class="draft-msg">${esc(draft)}</div>
          <p class="sub" style="margin-top:12px">"${esc(l.title)}" is now <b>on hold</b> and off the public site.</p>
        </div>
      </div>
    </div></div>`;
  }
  if(m.type==="menu"){
    const l=find(m.id); if(!l) return "";
    const acts=[];
    if(l.status==="active"){
      acts.push(["edit","edit listing"],["hold","put on hold"],["sold","mark as sold"],["del","delete"]);
    }else if(l.status==="hold"){
      acts.push(["edit","edit listing"],["active","mark as active"],["sold","mark as sold"],["del","delete"]);
    }else if(l.status==="draft"){
      acts.push(["edit","edit draft"],["pub","publish"],["del","delete"]);
    }
    return `<div class="veil" data-veil="1"><div class="modal sm" style="padding:22px">
      <button class="x" data-close="1" aria-label="close">${I.x}</button>
      <h3 style="font-size:18px;margin-bottom:4px">${esc(l.title)}</h3>
      <p class="sub" style="margin-bottom:14px">${esc(l.status)} &middot; listed ${ageLabel(l.ageDays)}</p>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${acts.map(([k,label])=>`<button class="btn ${k==="del"?"btn-ghost danger":"btn-outline"}" style="justify-content:flex-start" data-act="${k}|${l.id}">${label}</button>`).join("")}
      </div>
    </div></div>`;
  }
  if(m.type==="editdefault"){
    const f=m.field,u=S.user;
    const cfg={email:["princeton email",u.email],phone:["phone number",u.phone]}[f];
    return `<div class="veil" data-veil="1"><div class="modal sm" style="padding:24px">
      <button class="x" data-close="1" aria-label="close">${I.x}</button>
      <h3 style="font-size:18px;margin-bottom:12px">change your default ${esc(cfg[0])}</h3>
      <input class="inp" id="dflt" value="${esc(cfg[1])}">
      <p class="sub" style="margin:10px 0 16px">this updates your account, so every future listing uses it too.</p>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" data-close="1">cancel</button>
        <button class="btn btn-primary" data-savedefault="${esc(f)}">save</button>
      </div>
    </div></div>`;
  }
  return "";
}

/* ============ sell helpers ============ */
function startShot(){
  const s=SAMPLE_PHOTOS[(S.shotSeed++)%SAMPLE_PHOTOS.length];
  return {id:"p"+Date.now()+"_0",art:s.art,pal:s.pal};
}
/* a new listing starts at the seller's own sizes — most people sell their own clothes */
function blankItem(){
  const p=S.user.prefs;
  const z=blankSizing("alpha");
  /* prefs hold lists; a listing needs one value, so take the first they picked */
  const first=(a,fb)=> (a&&a.length) ? a[0] : fb;
  if(p.set){
    z.alpha=first(p.alpha,z.alpha); z.waist=first(p.waist,z.waist); z.length=first(p.length,z.length);
    z.fit=first(p.fit,z.fit); z.shoe=first(p.shoe,z.shoe); z.scale=p.shoeScale;
  }
  return {title:"",price:"",cat:"clothing",sub:"tops",occasion:"none",condition:"like new",
    brand:"",tryOn:false,desc:"",photos:[startShot()],publishedId:null,brandNote:null,sizing:z,
    dept: p.gender==="men's" ? "men's" : p.gender==="women's" ? "women's" : "unisex"};
}
function startSell(draftId){
  const u=S.user;
  S.sell=Object.assign(DEFAULTS().sell,{
    contact:{emailMode:"default",altEmail:"",phoneMode:"default",altPhone:"",
      pay:payOn().map(p=>p.id), pickup:u.pickup||""}
  });
  if(draftId){
    const d=find(draftId);
    if(d){
      S.sell.editingDraftId=draftId;
      const dphotos=[{id:"p1",art:d.art,pal:d.pal},{id:"p2",art:d.art,pal:d.pal}];
      S.sell.items=[{title:d.title,price:d.price,cat:d.cat,sub:d.sub,occasion:d.occasion,condition:d.condition,
        brand:d.brand,sizing:{...d.sizing},dept:d.dept,tryOn:d.tryOn,desc:d.desc,photos:dphotos}];
      S.sell.step=2;
      go("sell2"); return;
    }
  }
  S.sell.items=[blankItem()];
  go("sell1");
}
function saveDraft(){
  const items=S.sell.items.filter(i=>i.title.trim()||priceNum(i.price)>0);
  if(!items.length){ S.sell.savedAt=stamp(); toast("nothing to save yet — add an item name first"); render(); return; }
  if(S.sell.editingDraftId){
    const d=find(S.sell.editingDraftId);
    if(d) Object.assign(d,items[0],{price:priceNum(items[0].price),status:"draft"});
  }else{
    items.forEach(it=>{
      S.listings.unshift(makeListing(it,"draft"));
    });
    S.sell.editingDraftId=null;
    S.sell.items=S.sell.items.map(()=>blankItem()).slice(0,1);
  }
  S.sell.savedAt=stamp();
  toast("saved to drafts");
  S.you.tab="drafts";
  go("you");
}
function makeListing(it,status){
  const shot = it.photos[0] || SAMPLE_PHOTOS[S.listings.length%SAMPLE_PHOTOS.length];
  return {
    id:nid(), owner:"me", status:status, art:shot.art, pal:shot.pal,
    title:it.title.trim()||"untitled item", price:priceNum(it.price),
    brand:learnBrand(it.brand), sizing:{...it.sizing}, size:sizeLabel(it.sizing), dept: APPAREL.has(it.cat) ? (it.dept||"unisex") : "unisex",
    condition:it.condition, cat:it.cat, sub:it.sub, occasion:it.occasion,
    tryOn:CLOTHING_CATS.has(it.cat)?it.tryOn:false, desc:it.desc.trim(),
    offers:[], favs:0, ageDays:0, photos:Math.max(1,it.photos.length),
    pay:[...S.sell.contact.pay], pickup:S.sell.contact.pickup,
    posted:new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"}).toLowerCase(),
    seller:S.user.netid
  };
}
/* ---- brand autocomplete: driven by direct DOM writes so typing keeps focus ---- */
function drawSugg(idx){
  const box=document.querySelector(`[data-sugg="${idx}"]`);
  const input=document.querySelector(`[data-brandin="${idx}"]`);
  if(!box||!input) return;
  const q=input.value;
  const hits=brandMatches(q,7);
  const exact=hits.some(b=>normBrand(b.name)===normBrand(q));
  if(!hits.length && !q.trim()){ box.hidden=true; input.setAttribute("aria-expanded","false"); return; }
  box.innerHTML = hits.map(b=>
      `<button type="button" data-pickbrand="${idx}|${esc(b.name)}">${esc(b.name)}${b.added?` <span class="muted" style="font-size:11px">· added by a seller</span>`:""}</button>`
    ).join("") +
    (q.trim()&&!exact ? `<div class="new">press enter to add &ldquo;${esc(q.trim().toLowerCase())}&rdquo; as a new brand</div>` : "");
  box.hidden=false;
  input.setAttribute("aria-expanded","true");
}
function hideSugg(idx){
  const box=document.querySelector(`[data-sugg="${idx}"]`);
  const input=document.querySelector(`[data-brandin="${idx}"]`);
  if(box) box.hidden=true;
  if(input) input.setAttribute("aria-expanded","false");
}
function noteBrand(idx,kind,text){
  const it=S.sell.items[idx];
  it.brandNote = text ? {kind,text} : null;
  const el=document.querySelector(`[data-brandnote="${idx}"]`);
  if(el){ el.className="brandnote "+(text?kind:""); el.textContent=text||""; }
}
/* on blur or enter: collapse what they typed onto an existing brand where one fits */
function settleBrand(idx){
  const input=document.querySelector(`[data-brandin="${idx}"]`);
  if(!input) return;
  const raw=input.value.trim();
  const it=S.sell.items[idx];
  hideSugg(idx);
  if(!raw){ it.brand=""; noteBrand(idx,"",""); return; }
  const hit=canonBrand(raw);
  if(hit){
    it.brand=hit; input.value=hit;
    noteBrand(idx, "match", normBrand(hit)===normBrand(raw) ? "" : `matched to “${hit}”`);
  }else{
    it.brand=raw.toLowerCase(); input.value=it.brand;
    noteBrand(idx,"fresh","new brand — it'll join the list when you publish");
  }
}

/* Publishing needs at least one complete item; half-filled cards are simply
   skipped, so adding a blank card to a live batch never blocks the button. */
const priceNum = (v)=> parseFloat(String(v).replace(/[^0-9.]/g,"")) || 0;
function sellReady(){
  return S.sell.items.some(i=>String(i.title).trim() && priceNum(i.price)>0);
}
function sellIncomplete(){
  return S.sell.items.filter(i=>!(String(i.title).trim() && priceNum(i.price)>0)).length;
}
function syncPublish(){
  const b=document.querySelector("[data-publish]"); if(!b) return;
  const ready=sellReady();
  b.disabled=!ready;
  const hint=document.querySelector("[data-readyhint]");
  if(hint) hint.hidden=ready;
}
/* Publishes every item in the batch. Items already published in this batch are
   updated in place, so coming back from the success page to add more never
   duplicates what is already live. */
function publish(){
  const batch=[];
  S.sell.items.forEach((it,i)=>{
    if(!String(it.title).trim() || !(priceNum(it.price)>0)) return;
    const existingId = it.publishedId || (i===0 ? S.sell.editingDraftId : null);
    const existing = existingId ? find(existingId) : null;
    if(existing){
      Object.assign(existing, makeListing(it,"active"), {id:existing.id, offers:existing.offers, favs:existing.favs});
      it.publishedId=existing.id;
      batch.push(existing.id);
    }else{
      const l=makeListing(it,"active");
      S.listings.unshift(l);
      it.publishedId=l.id;
      batch.push(l.id);
    }
  });
  S.sell.editingDraftId=null;
  S.listings.forEach(l=>{ if(!batch.includes(l.id)&&mine(l)&&l.status==="active") l.ageDays=Math.max(1,l.ageDays); });
  S.sell.published=batch;
  go("sell3");
}

document.addEventListener("click",(e)=>{

    "[data-card],[data-fav],[data-morehome],[data-morebrowse],[data-back],[data-clearf],[data-clearall],"+
    "[data-makeoffer],[data-viewoffers],[data-sellstep],[data-savedraft],[data-addphoto],[data-delphoto],[data-rotphoto],"+
    "[data-additem],[data-delitem],[data-tryon],[data-publish],[data-youtab],[data-select],[data-bulkdel],[data-bulkdone],"+
    "[data-edit],[data-menu],[data-act],[data-close],[data-veil],[data-pickoffer],[data-acceptoffer],[data-sendoffer],"+
    "[data-toggletryon],[data-contact],[data-editdefault],[data-savedefault],"+
    "[data-signin],[data-onboard],[data-saveacct],[data-paytoggle],[data-addmore],"+
    "[data-sysswap],[data-fitsme],[data-obstep],[data-savep],[data-clearf],[data-clearall],[data-f],"+
    "[data-dept],[data-mstoggle],[data-mspick],[data-msall],[data-pop]");
  if(!t) {
    /* a click inside a panel lands on the label span first — keep it open then */
    if(S.openMs && !e.target.closest(".ms,.deptpick")){ S.openMs=null; render(); }
    return;
  }
  const d=t.dataset;
  /* clicking anywhere outside a dropdown dismisses it */
  if(S.openMs && !e.target.closest(".ms,.deptpick")) S.openMs=null;

  if(d.veil!==undefined && e.target===t){ closeModal(); return; }
  if(d.close!==undefined){ closeModal(); return; }

  if(d.go){
    if(d.go==="you"){ S.you.tab="current"; S.you.selectMode=false; S.you.selected.clear(); }
    go(d.go); return;
  }
  if(d.signin!==undefined){
    const v=$("#li-email"); if(v&&v.value.trim()) S.user.email=v.value.trim();
    S.user.netid=S.user.email.split("@")[0];
    S.signedIn=true;
    go(S.onboarded?"home":"onboarding"); return;
  }
  if(d.obstep){
    const p=$("#ob-phone");
    if(p) S.user.phone=p.value.trim()||S.user.phone;
    S.ob.step=Number(d.obstep); render(); return;
  }
  if(d.savep){
    const [k,v]=d.savep.split("|");
    S.user.prefs[k]= v==="true" ? true : v;
    if(k==="set"){ toast("sizes saved — 'fits me' is ready on the homepage"); }
    render(); return;
  }
  if(d.onboard){
    if(d.onboard!=="skip"){
      const p=$("#ob-phone");
      if(p) S.user.phone=p.value.trim()||S.user.phone;
      if(S.ob.step===2) S.user.prefs.set=true;
    }
    S.dept = S.user.prefs.gender==="men's" ? "men's"
           : S.user.prefs.gender==="women's" ? "women's" : "unisex";
    S.onboarded=true;
    S.home.fitsMe=S.user.prefs.set;
    go("home"); return;
  }
  if(d.fitsme){
    const f=S[d.fitsme];
    f.fitsMe=!f.fitsMe;
    if(f.fitsMe) f.size=[];
    S.homeCount=8; S.browseCount=12;
    render(); return;
  }
  if(d.dept){
    const [dv,sec]=d.dept.split("|");
    S.dept=dv;
    /* a department is a new place to stand, so facets reset — but whether the
       shopper wants "fits me" on is their choice, not something we re-impose */
    const keepFits=S.home.fitsMe;
    Object.assign(S.home,FILTER_DEFAULTS()); Object.assign(S.browse,FILTER_DEFAULTS());
    S.browse.cat=null; S.browse.sub=null; S.browse.q="";
    S.homeCount=8; S.browseCount=12; S.openMs=null;
    S.home.fitsMe=keepFits; S.browse.fitsMe=keepFits;
    S.openMs=null;
    if(sec){ S.browse.cat=sec; S.browse.sub=null; S.browse.q=""; go("browse"); return; }
    go(S.screen==="browse"||S.screen==="item"?"home":S.screen);
    return;
  }
  if(d.mstoggle){ S.openMs = S.openMs===d.mstoggle ? null : d.mstoggle; render(); return; }
  if(d.mspick){
    const [scope,key,...rest]=d.mspick.split("|");
    const v=rest.join("|");
    const cur=msGet(scope,key);
    msSet(scope,key, cur.includes(v) ? cur.filter(x=>x!==v) : [...cur,v]);
    if(key==="size"&&scope!=="prefs") S[scope].fitsMe=false;
    S.homeCount=8; S.browseCount=12;
    render(); return;
  }
  if(d.msall){
    const [scope,key]=d.msall.split("|");
    msSet(scope,key,[]);
    S.homeCount=8; S.browseCount=12;
    render(); return;
  }
  if(d.pop){
    const [scope,key,...rest]=d.pop.split("|");
    const v=rest.join("|");
    msSet(scope,key, msGet(scope,key).filter(x=>x!==v));
    S.homeCount=8; S.browseCount=12;
    render(); return;
  }
  if(d.clearf){
    const [scope,key]=d.clearf.split("|");
    S[scope][key] = key==="fitsMe" ? false : [];
    S.homeCount=8; S.browseCount=12;
    render(); return;
  }
  if(d.clearall){
    Object.assign(S[d.clearall], FILTER_DEFAULTS());
    S.homeCount=8; S.browseCount=12;
    render(); return;
  }
  if(d.paytoggle){
    const [scope,id]=d.paytoggle.split("|");
    const p=S.user.pay.find(x=>x.id===id);
    if(scope==="account"){
      if(p) p.on=!p.on;
      /* dropping an account method also drops it from the listing in progress */
      if(p&&!p.on) S.sell.contact.pay=S.sell.contact.pay.filter(x=>x!==id);
      else if(p&&!S.sell.contact.pay.includes(id)) S.sell.contact.pay.push(id);
    }else{
      /* the listing picker and your saved defaults are the same switch, so what
         you tick while listing is what you'll see pre-ticked next time */
      const arr=S.sell.contact.pay, i=arr.indexOf(id);
      if(i>-1){ arr.splice(i,1); if(p) p.on=false; }
      else { arr.push(id); if(p) p.on=true; }
    }
    render(); return;
  }
  if(d.payprefs!==undefined){ S.you.tab="contact"; go("you"); return; }
  if(d.signout!==undefined){ S.signedIn=false; go("landing"); return; }
  if(d.search!==undefined){ S.browse.q=""; go("search"); return; }
  if(d.favs!==undefined){ go("favs"); return; }
  if(d.back!==undefined){ go(S.from==="browse"?"browse":S.from==="favs"?"favs":S.from==="search"?"search":"home"); return; }

  if(d.section){
    S.browse.cat=d.section; S.browse.sub=null;
    S.browse.q=""; S.browseCount=12;
    Object.assign(S.browse,FILTER_DEFAULTS());
    go("browse"); return;
  }
  if(d.sub){
    const [c,s]=d.sub.split("|");
    S.browse.cat=c; S.browse.sub=s==="everything else"?null:s;
    S.browse.q=""; S.browseCount=12;
    go("browse"); return;
  }
  if(d.sell!==undefined){ startSell(null); return; }

  if(d.fav){ e.stopPropagation(); S.favs.has(d.fav)?S.favs.delete(d.fav):S.favs.add(d.fav); render(); return; }
  if(d.card){
    const l=find(d.card); if(!l) return;
    if(S.you.selectMode){
      S.you.selected.has(l.id)?S.you.selected.delete(l.id):S.you.selected.add(l.id);
      render(); return;
    }
    if(d.mode==="manage"){
      if(l.status==="active"&&l.offers.length){ S.selectedOffer=null; openModal({type:"offers",id:l.id}); return; }
      if(l.status==="draft"){ startSell(l.id); return; }
      openModal({type:"menu",id:l.id}); return;
    }
    if(d.mode==="none") return;
    S.itemId=l.id; S.from=S.screen; go("item"); return;
  }
  if(d.edit){ e.stopPropagation(); const l=find(d.edit); if(l&&l.status==="draft") startSell(l.id); else if(l){ startSell(null); S.sell.items=[{title:l.title,price:l.price,cat:l.cat,sub:l.sub,occasion:l.occasion,condition:l.condition,brand:l.brand,sizing:{...l.sizing},dept:l.dept,tryOn:l.tryOn,desc:l.desc,photos:[{id:"p1",art:l.art,pal:l.pal}]}]; S.sell.editingDraftId=l.id; go("sell2"); } return; }
  if(d.menu){ e.stopPropagation(); openModal({type:"menu",id:d.menu}); return; }
  if(d.act){
    const [k,id]=d.act.split("|"); const l=find(id); if(!l) return;
    if(k==="edit"){ closeModal(); startSell(l.status==="draft"?l.id:null); if(l.status!=="draft"){ S.sell.items=[{title:l.title,price:l.price,cat:l.cat,sub:l.sub,occasion:l.occasion,condition:l.condition,brand:l.brand,sizing:{...l.sizing},dept:l.dept,tryOn:l.tryOn,desc:l.desc,photos:[{id:"p1",art:l.art,pal:l.pal}]}]; S.sell.editingDraftId=l.id; go("sell2"); } return; }
    if(k==="hold"){ l.status="hold"; toast("moved to on hold"); }
    if(k==="active"){ l.status="active"; l.ageDays=0; toast("back on the site, top of the feed"); }
    if(k==="sold"){ l.status="sold"; toast("marked as sold"); }
    if(k==="pub"){ l.status="active"; l.ageDays=0; toast("published"); }
    if(k==="del"){ S.listings=S.listings.filter(x=>x.id!==id); toast("deleted"); }
    closeModal(); return;
  }

  if(d.morehome!==undefined){ S.homeCount+=8; render(); return; }
  if(d.morebrowse!==undefined){ S.browseCount+=12; render(); return; }

  if(d.makeoffer){
    const l=find(d.makeoffer);
    S.offerAmt=l.price; S.offerTryOn=false;
    openModal({type:"offer",id:l.id}); return;
  }
  if(d.toggletryon!==undefined){ S.offerTryOn=!S.offerTryOn; render(); return; }
  if(d.sendoffer){
    const l=find(d.sendoffer);
    const amt=Number(S.offerAmt)||0;
    if(amt<=0){ toast("enter an amount above $0"); return; }
    l.offers.unshift({amt:amt,netid:S.user.netid,when:"just now",tryOn:S.offerTryOn});
    closeModal();
    toast(`offer of ${money(amt)} sent to ${l.seller||S.user.netid}`);
    return;
  }
  if(d.viewoffers){ S.selectedOffer=null; openModal({type:"offers",id:d.viewoffers}); return; }
  if(d.pickoffer!==undefined){ S.selectedOffer=Number(d.pickoffer); render(); return; }
  if(d.acceptoffer){
    const l=find(d.acceptoffer);
    const offers=[...l.offers].sort((a,b)=>b.amt-a.amt);
    const o=offers[S.selectedOffer]; if(!o) return;
    l.status="hold"; l.ageDays=0;
    openModal({type:"touch",id:l.id,offer:o}); return;
  }
  if(d.contact){
    toast(d.contact==="email"?"opening your mail app with the draft":"opening messages with the draft");
    return;
  }

  if(d.sellstep){ S.sell.step=Number(d.sellstep); go("sell"+d.sellstep); return; }
  if(d.savedraft!==undefined){ saveDraft(); return; }
  if(d.addphoto!==undefined){
    const it=S.sell.items[Number(d.addphoto)];
    const s=SAMPLE_PHOTOS[(S.shotSeed++)%SAMPLE_PHOTOS.length];
    it.photos.push({id:"p"+Date.now()+"_"+it.photos.length,art:s.art,pal:s.pal});
    render(); return;
  }
  if(d.delphoto){
    const [i,pid]=d.delphoto.split("|");
    const it=S.sell.items[Number(i)];
    it.photos=it.photos.filter(x=>x.id!==pid);
    render(); return;
  }
  if(d.rotphoto){
    const [i,pid]=d.rotphoto.split("|");
    const p=S.sell.items[Number(i)].photos.find(x=>x.id===pid);
    if(p){ const s=SAMPLE_PHOTOS[(S.shotSeed++)%SAMPLE_PHOTOS.length]; p.art=s.art; p.pal=s.pal; }
    render(); return;
  }
  if(d.additem!==undefined){ S.sell.items.push(blankItem()); render(); return; }
  if(d.addmore!==undefined){
    S.sell.items.push(blankItem());
    S.sell.step=2; go("sell2");
    toast("added a blank item — fill it in and publish again");
    return;
  }
  if(d.delitem!==undefined){ S.sell.items.splice(Number(d.delitem),1); render(); return; }
  if(d.tryon!==undefined){ const i=Number(d.tryon); S.sell.items[i].tryOn=!S.sell.items[i].tryOn; render(); return; }
  if(d.sysswap){
    const [i,sys]=d.sysswap.split("|");
    const z=S.sell.items[Number(i)].sizing;
    z.system=sys; z.manual=true;   /* an explicit choice wins over the title guess */
    render(); return;
  }
  if(d.publish!==undefined){ publish(); return; }

  if(d.youtab){ S.you.tab=d.youtab; S.you.selectMode=false; S.you.selected.clear(); render(); return; }
  if(d.select!==undefined){ S.you.selectMode=!S.you.selectMode; S.you.selected.clear(); render(); return; }
  if(d.bulkdel!==undefined){
    const n=S.you.selected.size;
    S.listings=S.listings.filter(l=>!S.you.selected.has(l.id));
    S.you.selected.clear(); S.you.selectMode=false;
    toast(n+" listing"+(n===1?"":"s")+" deleted"); render(); return;
  }
  if(d.bulkdone!==undefined){ S.you.selectMode=false; S.you.selected.clear(); render(); return; }

  if(d.editdefault){ openModal({type:"editdefault",field:d.editdefault}); return; }
  if(d.savedefault){
    const v=$("#dflt").value.trim();
    const f=d.savedefault;
    if(v){
      if(f==="email") S.user.email=v;
      if(f==="phone") S.user.phone=v;
    }
    closeModal(); toast("default updated"); return;
  }
  if(d.saveacct!==undefined){
    ["email","phone","pickup"].forEach(k=>{
      const el=document.querySelector(`[data-u="${k}"]`);
      if(el) S.user[k]=el.value;
    });
    S.user.netid=S.user.email.split("@")[0];
    toast(payOn().length?"saved":"saved — heads up, you have no payment method turned on");
    render(); return;
  }
});

/* change / input handling */
document.addEventListener("change",(e)=>{
  const el=e.target, d=el.dataset;
  if(d.c){ const [k,v]=d.c.split("|"); S.sell.contact[k]=v; render(); return; }
  if(d.f){
    const [scope,key]=d.f.split("|");
    S[scope][key]=el.value;
    S.homeCount=8; S.browseCount=12;
    render(); return;
  }
  if(d.p){ S.user.prefs[d.p]=el.value; if(d.p==="gender") render(); return; }
  if(d.sz){
    const [i,k]=d.sz.split("|");
    S.sell.items[Number(i)].sizing[k]=el.value;
    render(); return;
  }
  if(d.it){
    const [i,k]=d.it.split("|"); const it=S.sell.items[Number(i)];
    it[k]= k==="tryOn" ? el.checked : el.value;
    if(k==="cat"){ it.sub=CATEGORIES[it.cat][0]; }
    if(k==="cat"||k==="sub"){ it.sizing.system=defaultSystem(it.cat,it.sub,it.title); render(); }
    return;
  }
});
document.addEventListener("input",(e)=>{
  const el=e.target, d=el.dataset;
  if(d.payhandle){ const p=S.user.pay.find(x=>x.id===d.payhandle); if(p) p.handle=el.value; return; }
  if(d.cv){ S.sell.contact[d.cv]=el.value; return; }
  if(d.it){ const [i,k]=d.it.split("|"); S.sell.items[Number(i)][k]=el.value; syncPublish(); return; }
  if(d.brandin!==undefined){
    const i=Number(d.brandin);
    S.sell.items[i].brand=el.value;
    noteBrand(i,"","");
    drawSugg(i);
    return;
  }
  if(d.offeramt!==undefined){ S.offerAmt=el.value; return; }
  if(d.u){ S.user[d.u]=el.value; return; }
  if(d.mssearch!==undefined){
    const panel=el.closest(".ms-panel"); if(!panel) return;
    const term=el.value.trim().toLowerCase();
    panel.querySelectorAll("[data-msrow]").forEach(r=>{
      r.hidden = term && !r.dataset.msrow.includes(term);
    });
    return;
  }
  if(d.navq!==undefined){
    S.browse.q=el.value;
    if(S.screen!=="search"){ S.from=S.screen; S.screen="search"; }
    render();
    const f=document.querySelector("[data-navq]");
    if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); }
    return;
  }
  if(d.q!==undefined){ S.browse.q=el.value; render(); return; }
});
/* "wide-leg jeans" under bottoms should switch itself to waist x length once
   the seller finishes typing — unless they already picked a system by hand */
/* tidy "$12" / " 12 " down to 12 once they leave the price field */
document.addEventListener("focusout",(e)=>{
  const pf=e.target.closest?.('[data-it$="|price"]');
  if(pf){
    const i=Number(pf.dataset.it.split("|")[0]);
    const n=priceNum(pf.value);
    const clean=n?String(n):"";
    if(pf.value!==clean){ pf.value=clean; S.sell.items[i].price=clean; }
    syncPublish();
  }
  const t=e.target.closest?.('[data-it$="|title"]');
  if(!t) return;
  const i=Number(t.dataset.it.split("|")[0]);
  const it=S.sell.items[i]; if(!it||it.sizing.manual) return;
  const want=defaultSystem(it.cat,it.sub,it.title);
  if(want!==it.sizing.system){ it.sizing.system=want; render(); }
});

/* brand input: focus opens the list, blur settles it, enter accepts */
document.addEventListener("focusin",(e)=>{
  const b=e.target.closest?.("[data-brandin]");
  if(b) drawSugg(Number(b.dataset.brandin));
});
document.addEventListener("focusout",(e)=>{
  const b=e.target.closest?.("[data-brandin]");
  if(!b) return;
  const i=Number(b.dataset.brandin);
  /* let a click on a suggestion land before the list closes */
  setTimeout(()=>{
    const box=document.querySelector(`[data-sugg="${i}"]`);
    if(box && box.contains(document.activeElement)) return;
    if(document.activeElement===b) return;
    settleBrand(i);
  },140);
});
document.addEventListener("click",(e)=>{
  const s=e.target.closest?.("[data-pickbrand]");
  if(!s) return;
  const [i,name]=s.dataset.pickbrand.split("|");
  const idx=Number(i);
  const input=document.querySelector(`[data-brandin="${idx}"]`);
  S.sell.items[idx].brand=name;
  if(input) input.value=name;
  hideSugg(idx);
  noteBrand(idx,"","");
});

document.addEventListener("submit",(e)=>{
  if(e.target.closest("[data-searchform]")){ e.preventDefault(); }
});
document.addEventListener("keydown",(e)=>{
  const b=e.target.closest?.("[data-brandin]");
  if(b){
    const i=Number(b.dataset.brandin);
    if(e.key==="Enter"){ e.preventDefault(); settleBrand(i); b.blur(); return; }
    if(e.key==="Escape"){ e.preventDefault(); hideSugg(i); return; }
  }
  if(e.key==="Escape"&&S.modal){ closeModal(); return; }
  if(e.key==="Enter"||e.key===" "){
    const t=e.target.closest?.('[role="button"]');
    if(t){ e.preventDefault(); t.click(); }
  }
});
window.addEventListener("scroll",()=>{
  const n=$(".nav"); if(n) n.classList.toggle("scrolled",window.scrollY>4);
},{passive:true});

$("#corner").addEventListener("click",(e)=>{
  if(e.target.closest("[data-themetoggle]")){
    S.theme = S.theme==="dark" ? "light" : "dark";
    render(); return;
  }
  if(e.target.closest("[data-reset]")){
    newState(S.theme);
    render(); toast("demo reset"); return;
  }
});

render();
})();
</script>
